<!DOCTYPE html>
<html lang="en" data-bs-theme="light" style="font-family: Kanit, sans-serif;">
<head>
    <!-- =========================
         BASIC PAGE SETUP
    ========================== -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Executive Board | Code4Hood</title>
    <meta name="description" content="Meet the Executive Board of Code4Hood.">

    <!-- =========================
         FAVICON
    ========================== -->
    <link rel="icon" type="image/png" sizes="1050x450"
        href="assets/img/code%204%20hood%20%20(3.5%20x%201.5%20in).png">

    <!-- =========================
         FONTS
    ========================== -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Kanit&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Slabo+13px&display=swap">

    <!-- =========================
         CORE CSS
    ========================== -->
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/aos.min.css">
    <link rel="stylesheet" href="assets/css/Banner-Heading-Image-images.css">
    <link rel="stylesheet" href="assets/css/Features-Large-Icons-icons.css">
    <link rel="stylesheet" href="assets/css/Lightbox-Gallery-baguetteBox.min.css">
    <link rel="stylesheet" href="assets/css/css/Navbar-Centered-Links-icons.css">
    <link rel="stylesheet" href="assets/css/css/Projects-Grid-Horizontal-images.css">
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <!-- =========================
         PAGE STYLES
    ========================== -->
    <style>
        :root {
            --bs-primary: #79b104;
            --bs-primary-rgb: 121, 177, 4;
        }

        body {
            font-family: Kanit, sans-serif;
            background: #ffffff;
        }

        .page-section {
            padding-top: 120px;
            padding-bottom: 70px;
        }

        .section-subtext {
            max-width: 720px;
            margin: 0 auto;
            color: #6c757d;
            line-height: 1.7;
        }

        .team-card {
            border: 0;
            background: #fff;
            border-radius: 16px;
            padding: 24px 16px;
            height: 100%;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .team-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 14px 30px rgba(0, 0, 0, 0.10);
        }

        .team-photo {
            width: 140px;
            height: 140px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid #f8f9fa;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .team-card:hover .team-photo {
            transform: scale(1.05);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
        }

        .team-name {
            color: #79b104;
        }

        .team-role {
            color: #6c757d;
            min-height: 48px;
        }

        .footer-link {
            color: #ccc;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-link:hover {
            color: #79b104;
            padding-left: 5px;
        }

        .social-icon {
            color: #ccc;
            transition: 0.3s;
        }

        .social-icon:hover {
            color: #79b104;
            transform: scale(1.2);
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR PLACEHOLDER
    ========================== -->
    <div id="navbar-placeholder"></div>

    <!-- =========================
         EXECUTIVE BOARD SECTION
    ========================== -->
    <main>
    <section class="page-section">
        <div class="container py-4 py-xl-5">
            <div class="row mb-4 mb-lg-5">
                <div class="col-md-10 col-xl-8 text-center mx-auto" data-aos="fade-up" data-aos-duration="900">
                    <h2><span style="text-decoration: underline;">Executive Board</span></h2>
                    <p class="section-subtext mt-3">
                        Meet the leaders who help guide our mission, strengthen our impact, and support the vision behind Code 4 Hood.
                    </p>
                </div>
            </div>

            <div class="row gy-4 row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 justify-content-center">

                <!-- Team Member 1 -->
                <div class="col" data-aos="zoom-in" data-aos-duration="900" data-aos-delay="100">
                    <div class="team-card text-center d-flex flex-column align-items-center">
                        <img class="team-photo mb-3"
                            src="assets/img/additional/team/Alona.png"
                            alt="Alona Jennings">
                        <h5 class="fw-bold team-name mb-1">Alona Jennings</h5>
                        <p class="team-role mb-0">Founder</p>
                    </div>
                </div>

                <!-- Team Member 2 -->
                <div class="col" data-aos="zoom-in" data-aos-duration="900" data-aos-delay="200">
                    <div class="team-card text-center d-flex flex-column align-items-center">
                        <img class="team-photo mb-3"
                            src="assets/img/additional/team/Shameika_leon.JPG"
                            alt="Shameika Leon">
                        <h5 class="fw-bold team-name mb-1">Shameika Leon</h5>
                        <p class="team-role mb-0">VP President</p>
                    </div>
                </div>

                <!-- Team Member 3 -->
                <div class="col" data-aos="zoom-in" data-aos-duration="900" data-aos-delay="300">
                    <div class="team-card text-center d-flex flex-column align-items-center">
                        <img class="team-photo mb-3"
                            src="https://cdn.bootstrapstudio.io/placeholders/1400x800.png"
                            alt="Vacant Secretary position">
                        <h5 class="fw-bold team-name mb-1">Vacant</h5>
                        <p class="team-role mb-0">Secretary</p>
                    </div>
                </div>

                <!-- Team Member 4 -->
                <div class="col" data-aos="zoom-in" data-aos-duration="900" data-aos-delay="400">
                    <div class="team-card text-center d-flex flex-column align-items-center">
                        <img class="team-photo mb-3"
                            src="https://cdn.bootstrapstudio.io/placeholders/1400x800.png"
                            alt="Vacant Treasurer position">
                        <h5 class="fw-bold team-name mb-1">Vacant</h5>
                        <p class="team-role mb-0">Treasurer</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
</main>
    <!-- =========================
         FOOTER PLACEHOLDER
    ========================== -->
    <div id="footer-placeholder"></div>

    <!-- =========================
         JAVASCRIPT FILES
    ========================== -->
    <script src="assets/bootstrap/js/bootstrap.min.js"></script>
    <script src="assets/js/aos.min.js"></script>
    <script src="assets/js/bs-init.js"></script>
    <script src="assets/js/js/Lightbox-Gallery-baguetteBox.min.js"></script>
    <script src="assets/js/js/Lightbox-Gallery.js"></script>
    <script src="assets/js/components.js"></script>

    <!-- =========================
         AOS INITIALIZATION
    ========================== -->
    <script>
        AOS.init({
            duration: 900,
            once: false,
            mirror: false,
            offset: 80
        });
    </script>
</body>
</html>
