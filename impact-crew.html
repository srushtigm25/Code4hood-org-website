    <!-- =========================
         PAGE STYLES
    ========================== -->
    <style>
        :root {
            --bs-primary: #79b104;
            --bs-primary-rgb: 121, 177, 4;
        }

        html,
        body {
            height: 100%;
        }

        body {
            font-family: Kanit, sans-serif;
            background: #ffffff;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            padding-top: 90px;
        }

        .page-section {
            padding: 60px 0;
        }

        .section-subtext {
            max-width: 720px;
            margin: 0 auto;
            color: #6c757d;
            line-height: 1.7;
        }

        .team-card {
            border: 0;
            background: #ffffff;
            border-radius: 16px;
            padding: 28px 18px;
            height: 100%;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.05);
        }

        .team-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.10);
        }

        .team-initial {
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(121, 177, 4, 0.12);
            color: #79b104;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 18px;
            transition: transform 0.35s ease, box-shadow 0.35s ease;
        }

        .team-card:hover .team-initial {
            transform: scale(1.06);
            box-shadow: 0 10px 24px rgba(121, 177, 4, 0.18);
        }

        .team-name {
            color: #79b104;
            margin-bottom: 0;
        }

        .footer-link {
            color: #ccc;
            text-decoration: none;
            transition: 0.3s;
        }

        .footer-link:hover {
            color: #79b104;
            padding-left: 5px;
        }

        .social-icon {
            color: #ccc;
            transition: 0.3s;
        }

        .social-icon:hover {
            color: #79b104;
            transform: scale(1.2);
        }
    </style>
</head>
